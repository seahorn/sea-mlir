# Test the binary release of a GitHub release as a user installs it: download
# its Linux tarballs, check their SHA-256 files, install the runtime packages
# of docs/Release.md ("Runtime requirements"), extract each tarball outside
# the checkout and smoke it (docker/smoke/test-tarball.sh, check.sh: every
# tool runs, the --agent DOCS line, sat / unsat with each solver, the shipped
# profiles, no build path; the bundle also C -> SeaHorn -> sea-vc). Nothing
# is compiled. Release steps: docs/Release.md ("Publishing a binary release").
#
# Runs when a release or a prerelease is published (`published` covers both;
# `prereleased` would start a second run of the same prerelease; promoting a
# prerelease changes no file), and by hand:
#   gh workflow run release-test.yml -f tag=v0.6.0 [-f repo=OWNER/NAME]
#     [-f version=0.6.0] [-f xfail="agent-docs build-paths"]
# (releases built before the version-tag check, v0.5.0 and older, need
# `-f xfail=version-tag` along with their other old-release xfails.)
# (version: of the tarballs, default the tag without its `v`; a trial tag
# such as v0.5.0-ci-trial holding 0.5.0 tarballs needs -f version=0.5.0.)
# A release whose tag's commit lacks this file never starts it: GitHub runs
# the workflow of the tagged commit for the release event.
# The smoke scripts come from the workflow's ref: the release's tag, or the
# branch a manual run names (so newer checks can test an older release).
# homebrew-macos (by hand, -f tap-ref=REF) installs the tap's macOS bottle;
# see its comment below.
name: release test

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to test (v<version>)
        required: true
        type: string
      repo:
        description: Repository of the release (default this one)
        required: false
        type: string
      version:
        description: Version in the tarball names (default the tag without v)
        required: false
        type: string
      xfail:
        description: Checks expected to fail (check.sh names), for old releases
        required: false
        type: string
      tap-ref:
        description: Ref of seahorn/homebrew-seahorn whose bottle to test on macOS (empty = no macOS job)
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: release-test-${{ inputs.repo || github.repository }}-${{ inputs.tag || github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  tgz-linux:
    strategy:
      fail-fast: false
      matrix:
        # versions named explicitly, not ubuntu-latest
        os: [ubuntu-24.04, ubuntu-26.04]
        package: [standalone, bundle]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      TAG: ${{ inputs.tag || github.event.release.tag_name }}
      REPO: ${{ inputs.repo || github.repository }}
      VERSION: ${{ inputs.version }}
      PACKAGE: ${{ matrix.package }}
      SMOKE_XFAIL: ${{ inputs.xfail }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download the release's tarball, SHA-256 file and manifest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [[ "$TAG" =~ ^v[0-9A-Za-z._-]+$ ]] || { echo "bad tag: $TAG"; exit 1; }
          [[ "$REPO" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]] || { echo "bad repo: $REPO"; exit 1; }
          [[ -z "$VERSION" || "$VERSION" =~ ^[0-9A-Za-z._-]+$ ]] || { echo "bad version: $VERSION"; exit 1; }
          if [ "$PACKAGE" = bundle ]; then
            pattern='sea-mlir-bundle-*-linux-x86_64.*'
          else
            pattern='sea-mlir-[0-9]*-linux-x86_64.*'
          fi
          gh release download "$TAG" --repo "$REPO" \
            --dir "$RUNNER_TEMP/assets" --pattern "$pattern"
          ls -l "$RUNNER_TEMP/assets"
      - name: Install the runtime packages of docs/Release.md
        # Only these packages count: the hosted image already has many
        # (clang, LLVM, Python), which can hide a missing one; the local
        # check in a clean ubuntu container does not (docs/Release.md).
        run: |
          packages="libgmpxx4ldbl libmpfr6"
          if [ "$PACKAGE" = bundle ]; then
            packages="$packages clang-18 python3"
          fi
          sudo apt-get update -q
          # shellcheck disable=SC2086 # a list of package names
          sudo apt-get install -y --no-install-recommends $packages
      - name: Smoke the extracted tarball
        env:
          TMPDIR: ${{ runner.temp }}
        run: |
          # the tag must show in --version and --agent only for a tag
          # named v<version>; a trial tag skips that check
          if [ "$TAG" = "v${VERSION:-${TAG#v}}" ]; then export SMOKE_TAG="$TAG"; fi
          sh docker/smoke/test-tarball.sh "$RUNNER_TEMP/assets" "$PACKAGE" "${VERSION:-${TAG#v}}"

  # The macOS bottle of the tap (seahorn/homebrew-seahorn) as a user
  # installs it: from the bottle only, never built from source. By hand
  # only, with the tap ref whose formula carries the bottle line: macOS
  # bottles are added after the release (docs/Release.md, "macOS"):
  #   gh workflow run release-test.yml -f tag=v0.6.1 -f tap-ref=main
  # macos-26 is arm64 macOS 26, the oldest macOS the bottle (arm64_tahoe)
  # supports; no hosted runner runs macOS 27 (arm64_golden_gate).
  homebrew-macos:
    if: inputs.tap-ref != ''
    strategy:
      fail-fast: false
      matrix:
        os: [macos-26]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      TAG: ${{ inputs.tag }}
      VERSION: ${{ inputs.version }}
      TAP_REF: ${{ inputs.tap-ref }}
      SMOKE_XFAIL: ${{ inputs.xfail }}
      HOMEBREW_NO_AUTO_UPDATE: 1
      HOMEBREW_NO_ANALYTICS: 1
      HOMEBREW_NO_ENV_HINTS: 1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Tap seahorn/seahorn at the tap ref
        run: |
          [[ "$TAG" =~ ^v[0-9A-Za-z._-]+$ ]] || { echo "bad tag: $TAG"; exit 1; }
          [[ -z "$VERSION" || "$VERSION" =~ ^[0-9A-Za-z._-]+$ ]] || { echo "bad version: $VERSION"; exit 1; }
          [[ "$TAP_REF" =~ ^[A-Za-z0-9._/-]+$ ]] || { echo "bad tap ref: $TAP_REF"; exit 1; }
          # the image's Homebrew may predate 7.0 (brew trust); then pinned
          brew update --quiet
          brew --version
          brew ruby -e 'abort "Homebrew #{HOMEBREW_VERSION} < 7.0" if Version.new(HOMEBREW_VERSION) < Version.new("7.0")'
          brew tap seahorn/seahorn
          tap=$(brew --repository seahorn/seahorn)
          git -C "$tap" fetch origin "$TAP_REF"
          git -C "$tap" checkout --detach FETCH_HEAD
          git -C "$tap" log --oneline -1
          # Homebrew loads formulae of other taps only once they are trusted
          brew trust seahorn/seahorn
      - name: Install sea-mlir from its bottle only
        run: |
          # the formula's version, and a bottle for this macOS: a missing
          # bottle would otherwise start a source build (LLVM, hours)
          brew ruby -e '
            f = Formula["seahorn/seahorn/sea-mlir"]
            want = ARGV.fetch(0)
            abort "formula version #{f.version}, expected #{want}" unless f.version.to_s == want
            abort "no bottle of #{f.full_name} #{f.version} for #{Utils::Bottles.tag}" unless f.bottled?
            puts "bottle: #{f.full_name} #{f.version} #{Utils::Bottles.tag}"
          ' "${VERSION:-${TAG#v}}"
          brew install seahorn/seahorn/sea-mlir
          brew ruby -e '
            built = Formula.installed.reject { |f| f.any_installed_keg&.tab&.poured_from_bottle }
            abort "built from source, not poured: #{built.map(&:full_name).join(" ")}" unless built.empty?
            puts "poured from bottles: #{Formula.installed.map(&:full_name).sort.join(" ")}"
          '
      - name: Check its libraries and run the formula's test
        run: |
          brew linkage --test --strict seahorn/seahorn/sea-mlir
          brew test seahorn/seahorn/sea-mlir
      - name: Smoke the installed keg
        env:
          TMPDIR: ${{ runner.temp }}
        run: |
          if [ "$TAG" = "v${VERSION:-${TAG#v}}" ]; then export SMOKE_TAG="$TAG"; fi
          work=$(mktemp -d)
          fixtures=$PWD/docker/smoke
          cd "$work"
          sh "$fixtures/check.sh" "$(brew --prefix seahorn/seahorn/sea-mlir)" standalone
