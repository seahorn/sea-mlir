# seam.cfg - an EXAMPLE sea-vc profile (sea-vc --config=seam), not a
# recommended default: the defaults of sea-vc are still open.
#
# Lowers the program (sea-vc-lower) and encodes memory with SeaM: the
# object-aware rewriting of loads and stores, under the assumption A-INB
# (every access stays in its object; reported as seam.inb).
# Options on the command line, and later --config files, override these.
--lower
--seam
