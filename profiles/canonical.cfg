# canonical.cfg - an EXAMPLE sea-vc profile (sea-vc --config=canonical), not
# a recommended default: the defaults of sea-vc are still open.
#
# The measured "canonical" configuration of the query's linear forms
# (docs/design/CanonicalSums.md). Like seam.cfg it does not lower the
# program: combine it, as in
#   sea-vc p.mlir --config=seam --config=canonical
# Options on the command line, and later --config files, override these.
#
#   --solver-nary-sums               an n-ary bvadd / bvmul / bvand / bvor /
#                                    bvxor reaches the solver as one n-ary
#                                    term, not a chain of binary ones
#   --vc-canonical-sums              every linear bit-vector term becomes
#                                    one canonical sum of leaves with a
#                                    constant (equal sums, equal terms)
#   --vc-canonical-sums-neg=auto     the negation of a sum is written the
#                                    way the solver takes it: bvsub for
#                                    Yices, bvnot for z3 and Bitwuzla
#   --vc-canonical-sums-eq=unshared  an equality is balanced (shared terms
#                                    cancelled) only when one side is a sum
#                                    used once; other equalities keep both
#                                    sides, each canonical
#   --vc-canonical-sums-inner=flatten
#                                    every inner sum is merged into the sum
#                                    that contains it
#   --z3-tactic=<S2>                 for z3: the tactic S2 (below)
#
# Why: measured on the firedancer and vcc jobs that take more than 5 s,
# z3 with 3 seeds: 132 of 132 runs solved, against 130 of 132 with the
# defaults, and the total time 40% lower. Known slower jobs:
# h2fc-settings-proof (225 s to 625 s) and step-reach-sz (11 s to 45 s).
# Yices and Bitwuzla were also faster or equal (with their own solver,
# --z3-tactic does nothing).
#
# The tactic S2 assumes a pure QF_BV goal. It has no ackermannize_bv and
# no SMT-core fallback, so it is meant for the default --ackermannize
# lowering, where the query is pure bit-vectors. With arrays left in the
# query (--ackermannize=off) or uninterpreted functions (--ro-arrays=uf),
# z3 cannot run it: see docs/Profiles.md for what sea-vc then reports.
--solver-nary-sums
--vc-canonical-sums
--vc-canonical-sums-neg=auto
--vc-canonical-sums-eq=unshared
--vc-canonical-sums-inner=flatten
--z3-tactic="(using-params (then (using-params simplify :som true :pull_cheap_ite true :push_ite_bv false :local_ctx true :local_ctx_limit 10000000 :flat true :hoist_mul false :flat_and_or false) max-bv-sharing bit-blast (if-no-proofs aig) sat) :elim_and true :push_ite_bv true :blast_distinct true)"
